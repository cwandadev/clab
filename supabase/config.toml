skip_verification = false

[auth.sms]
enabled = true
provider = "twilio"
twilio_account_sid = "your-twilio-account-sid"
twilio_auth_token = "your-twilio-auth-token"
twilio_message_service_sid = "your-twilio-messaging-service-sid"
otp_length = 6
otp_expiry = 300
