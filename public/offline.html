<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#fafafa" />
  <title>You're offline — Clab</title>
  <link rel="icon" href="/favicon-192x192.png" />
  <style>
    :root { color-scheme: light dark; --bg: #fafafa; --fg: #18181b; --muted: #5f6068; --accent: #047857; }
    @media (prefers-color-scheme: dark) { :root { --bg: #18181b; --fg: #fafafa; --muted: #a1a1aa; } }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100dvh; display: grid; place-items: center; background: var(--bg); color: var(--fg);
           font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; padding: 24px; text-align: center; }
    img { width: 72px; height: 72px; border-radius: 16px; }
    h1 { font-size: 1.25rem; font-weight: 500; margin: 20px 0 6px; }
    p { color: var(--muted); max-width: 34ch; margin: 0 auto 24px; }
    button { font: inherit; font-weight: 500; border: 0; border-radius: 8px; padding: 12px 24px; min-height: 44px;
             background: var(--fg); color: var(--bg); cursor: pointer; }
    button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  </style>
</head>
<body>
  <main>
    <img src="/favicon-192x192.png" alt="" />
    <h1>You're offline</h1>
    <p>Check your connection. Your cart is saved on this phone and will be here when you're back.</p>
    <button onclick="location.reload()">Try again</button>
  </main>
  <script>addEventListener("online", () => location.reload());</script>
</body>
</html>
